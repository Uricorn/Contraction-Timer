# Weekly updates, grouped per ecosystem so related bumps arrive as one PR.
# We start on the latest versions, so day-one noise should be minimal.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # typescript-eslint peers on typescript <6.1; revisit once it supports 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gradle
    directory: /android
    schedule: { interval: weekly }
    groups:
      gradle:
        patterns: ["*"]
    ignore:
      # AGP 8.x breaks on Gradle >= 9.6; revisit when moving to AGP 9.
      - dependency-name: gradle
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
