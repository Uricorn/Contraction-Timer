name: Latest debug

# Builds a debug APK on every push to main (and nightly as a fallback) and
# keeps it as the single asset of a rolling "latest-debug" pre-release.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest-debug
  cancel-in-progress: false

jobs:
  latest-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check for new commits (nightly runs skip if unchanged)
        id: changes
        run: |
          git fetch --tags --force
          if [ "$(git rev-parse -q --verify refs/tags/latest-debug^{commit})" = "$(git rev-parse HEAD)" ] \
            && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - if: steps.changes.outputs.changed == 'true'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - if: steps.changes.outputs.changed == 'true'
        run: |
          npm ci
          npm test
          npm run android:sync
      - if: steps.changes.outputs.changed == 'true'
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - name: Name the APK
        if: steps.changes.outputs.changed == 'true'
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk contraction-timer-debug.apk
      - name: Move the latest-debug tag
        if: steps.changes.outputs.changed == 'true'
        run: |
          git tag -f latest-debug
          git push -f origin refs/tags/latest-debug
      - if: steps.changes.outputs.changed == 'true'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: latest-debug
          name: Latest debug build
          prerelease: true
          body: "Automated debug build of `${{ github.sha }}`. Not for production use."
          files: contraction-timer-debug.apk
