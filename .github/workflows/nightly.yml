name: Nightly

# Builds a debug APK every night and publishes it to a rolling "nightly"
# pre-release. Skipped when nothing changed since the last nightly build.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check for new commits
        id: changes
        run: |
          git fetch --tags --force
          if [ "$(git rev-parse -q --verify refs/tags/nightly^{commit})" = "$(git rev-parse HEAD)" ] \
            && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - if: steps.changes.outputs.changed == 'true'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - if: steps.changes.outputs.changed == 'true'
        run: |
          npm ci
          npm test
          npm run android:sync
      - if: steps.changes.outputs.changed == 'true'
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - name: Name the APK
        if: steps.changes.outputs.changed == 'true'
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            "contraction-timer-nightly-$(date -u +%Y%m%d).apk"
      - name: Move the nightly tag
        if: steps.changes.outputs.changed == 'true'
        run: |
          git tag -f nightly
          git push -f origin refs/tags/nightly
      - if: steps.changes.outputs.changed == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: nightly
          name: Nightly build
          prerelease: true
          body: "Automated debug build of `${{ github.sha }}`. Not for production use."
          files: contraction-timer-nightly-*.apk
