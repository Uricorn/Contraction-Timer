name: Release

# Push a tag like v0.1.0 to build an APK and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm test
      - run: npm run android:sync
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: android
      - name: Sign APK (only when signing secrets are configured)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          dir=android/app/build/outputs/apk/release
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > /tmp/release.keystore
            "$ANDROID_HOME"/build-tools/*/apksigner sign \
              --ks /tmp/release.keystore --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD \
              --out "$dir/contraction-timer-${GITHUB_REF_NAME}.apk" "$dir/app-release-unsigned.apk"
          else
            echo "No signing key configured; publishing the unsigned APK."
            cp "$dir/app-release-unsigned.apk" "$dir/contraction-timer-${GITHUB_REF_NAME}-unsigned.apk"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: android/app/build/outputs/apk/release/contraction-timer-*.apk
