name: Release

# Push a tag like v0.1.0 to build an APK and publish a GitHub release.
# Pushing to main releases automatically when package.json's version has no
# v<version> tag yet (bump the version to cut a release).
# Also runs when a release is published (tags created by other workflows or the
# API with GITHUB_TOKEN do not trigger push events) or manually with a tag.
on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release (e.g. v0.1.0)
        required: true

concurrency:
  group: release-${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      release: ${{ steps.t.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: t
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "branch" ]; then
            tag="v$(node -p "require('./package.json').version")"
            git fetch --tags --force
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "release=false" >> "$GITHUB_OUTPUT"
            else
              git tag "$tag"
              git push origin "refs/tags/$tag"
              echo "release=true" >> "$GITHUB_OUTPUT"
            fi
          else
            tag="${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  apk:
    needs: meta
    if: needs.meta.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: npm ci
      - run: npm test
      - run: npm run android:sync
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: android
      - name: Sign APK (only when signing secrets are configured)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          dir=android/app/build/outputs/apk/release
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > /tmp/release.keystore
            "$ANDROID_HOME"/build-tools/*/apksigner sign \
              --ks /tmp/release.keystore --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD \
              --out "$dir/contraction-timer-${TAG}.apk" "$dir/app-release-unsigned.apk"
          else
            echo "No signing key configured; publishing the unsigned APK."
            cp "$dir/app-release-unsigned.apk" "$dir/contraction-timer-${TAG}-unsigned.apk"
          fi
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
          files: android/app/build/outputs/apk/release/contraction-timer-*.apk
