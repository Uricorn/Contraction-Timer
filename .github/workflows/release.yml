name: Release

# Push a tag like v0.1.0 to build an APK and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: npm ci
      - run: npm test
      - run: npm run android:sync
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: android
      - name: Sign APK (only when signing secrets are configured)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          dir=android/app/build/outputs/apk/release
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > /tmp/release.keystore
            "$ANDROID_HOME"/build-tools/*/apksigner sign \
              --ks /tmp/release.keystore --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD \
              --out "$dir/contraction-timer-${GITHUB_REF_NAME}.apk" "$dir/app-release-unsigned.apk"
          else
            echo "No signing key configured; publishing the unsigned APK."
            cp "$dir/app-release-unsigned.apk" "$dir/contraction-timer-${GITHUB_REF_NAME}-unsigned.apk"
          fi
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: android/app/build/outputs/apk/release/contraction-timer-*.apk
